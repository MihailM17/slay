name: release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          # full history + tags: tauri-action needs the tag ref present
          # to know which release to upload bundles to
          fetch-depth: 0

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Slay __VERSION__'
          releaseBody: "Slay hex-strategy remake.\n\nmacOS: open the .dmg, drag to Applications.\nWindows: run the -setup.exe installer.\nLinux / Omarchy: chmod +x the .AppImage and run it (.deb attached too)."
          releaseDraft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Android APK for sideloading (debug-signed: install on your own phone,
  # no dev account needed). Runs beside the desktop matrix above; both
  # attach to the same tag release.
  android:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu runners ship an Android SDK already; setup-android fights it,
      # so drive the preinstalled cmdline-tools directly (quoting intact)
      - name: install Android packages
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"

      - run: npm ci

      - name: restore release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/slay-release.keystore

      - name: init Android project
        run: npx tauri android init
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: build unsigned per-ABI release APKs
        run: npx tauri android build --apk --split-per-abi
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973

      - name: sign APKs with the release key
        run: |
          shopt -s nullglob
          ls src-tauri/gen/android/app/build/outputs/apk/*/
          mkdir -p release-apks
          for f in src-tauri/gen/android/app/build/outputs/apk/*/*-release-unsigned.apk; do
            dd=$(dirname "$f")
            abi=$(basename "$(dirname "$dd")")
            out="release-apks/Slay_1.0.1_${abi}.apk"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
              --ks /tmp/slay-release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass:env KS_PASS --key-pass:env KEY_PASS \
              --out "$out" "$f"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$out" | head -3
          done
          ls -la release-apks/
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - uses: actions/upload-artifact@v4
        with:
          name: slay-android-apk
          path: release-apks/*.apk
          if-no-files-found: error

      - name: attach APKs to release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/app-*-release.apk
